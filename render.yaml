services:
  # ── Django Backend ───────────────────────────────────────────────────────
  - type: web
    name: cafeteria-backend
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 4 --timeout 120
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "cafeteria-backend.onrender.com,cafeteria-systemchi.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://cafeteria-frontend.onrender.com,https://cafeteria-systemchi.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://cafeteria-frontend.onrender.com,https://cafeteria-systemchi.vercel.app,https://cafeteria-backend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cafeteria-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: PYTHON_VERSION
        value: "3.12.3"

  # ── React Frontend (Static Site) ─────────────────────────────────────────
  - type: web
    name: cafeteria-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://cafeteria-backend.onrender.com/api/"

# ── PostgreSQL Database ───────────────────────────────────────────────────
databases:
  - name: cafeteria-db
    databaseName: cafeteria_prod
    plan: starter
    region: oregon
